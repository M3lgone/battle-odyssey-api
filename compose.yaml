services:
  api:
    build: .
    container_name: battle-odyssey-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      # Fixed dedicated user so any local .env (e.g. DB_USERNAME=root)
      # can never leak into the project database or break MYSQL_USER.
      DB_DATABASE: battle_odyssey_api
      DB_USERNAME: battle
      DB_PASSWORD: battle
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    entrypoint: entrypoint.sh
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]

  db:
    image: mysql:8.4
    container_name: battle-odyssey-db
    environment:
      MYSQL_DATABASE: battle_odyssey_api
      MYSQL_USER: battle
      MYSQL_PASSWORD: battle
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  vendor: {}
  db-data: {}
